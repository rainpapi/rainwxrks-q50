name: Build APK and EPK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Build debug APK + EPK
        run: ./build.sh debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: q50-apk
          path: "**/*.apk"
          if-no-files-found: error

      - name: Upload EPK
        uses: actions/upload-artifact@v4
        with:
          name: q50-epk
          path: "**/*.epk"
          if-no-files-found: error
